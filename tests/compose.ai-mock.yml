# Explicit test overlay. Synthetic fixture protocol only.
services:
  ai-mock:
    image: python:3.13-slim-bookworm
    volumes:
      - ./tests:/tests:ro
    command: ["python","-u","/tests/ai_mock.py"]
  backend:
    environment:
      AI_ENABLED: "true"
      AI_ALLOW_INSECURE_HTTP: "true"
      AI_BASE_URL: http://ai-mock:8765/v1
      AI_API_KEY: local-fixture-only
      AI_CHAT_MODEL: fixture-chat
      AI_EMBEDDING_BASE_URL: http://ai-mock:8765/v1
      AI_EMBEDDING_API_KEY: local-fixture-only
      AI_EMBEDDING_MODEL: fixture-embedding
      AI_EMBEDDING_VERSION: ${OF_TEST_VECTOR_VERSION:-1}
      AI_USER_MINUTE_LIMIT: "120"
      AI_DAILY_CALL_LIMIT: "1000"
